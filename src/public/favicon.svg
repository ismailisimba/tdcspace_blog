<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deep space background -->
  <circle cx="32" cy="32" r="32" fill="#0a0a0a" />
  
  <!-- Orbiting ring -->
  <ellipse cx="32" cy="32" rx="24" ry="8" fill="none" stroke="#e5e7eb" stroke-width="3" transform="rotate(-30 32 32)" />
  
  <!-- Planet core -->
  <circle cx="32" cy="32" r="14" fill="#ffffff" />
  
  <!-- Distant stars -->
  <circle cx="48" cy="16" r="2" fill="#9ca3af" />
  <circle cx="12" cy="46" r="1.5" fill="#9ca3af" />
</svg>
